<!DOCTYPE html>
<html>
<head>
    <title>
        Users
    </title>
</head>
<body>
     <h1>Users</h1>
     <table>
         <thead> <tr>
             <th>Employee Number</th>
             <th>User Name</th>
             <th>Email</th>
             <th>Company</th>
             <th>Department</th>
             <th>Role</th>
             <th>Is Active</th>
             <th>Created At</th>
         </tr>
         </thead>
         <tbody id = "userTableBody">

         </tbody>
     </table>

     <form id ="userForm">
         <input type="text" id="employeeId" placeholder="Employee ID">
         <input type="text" id="fullName" placeholder="Full Name">
         <input type="text" id="email" placeholder="Email">
         <input type="text" id="company" placeholder="Company">
         <input type="text" id="department" placeholder="Department">
         <input type="text" id="role" placeholder="Role">
         <button type="submit">Add User</button>
     </form>

     <p id="message" style="color: darkred"></p>
<script>
    async function loadUsers() {
        const response = await fetch("http://localhost:8080/api/user");
        const users = await response.json();
        console.log(users);
        document.getElementById("userTableBody").innerHTML = "";
        users.forEach(function(user){
            const row = `<tr>
                <td>${user.employeeId}</td>
                <td>${user.fullName}</td>
                <td>${user.email}</td>
                <td>${user.company}</td>
                <td>${user.department}</td>
                <td>${user.role}</td>
                <td>${user.active}</td>
        <td>${user.createdAt}</td>
    </tr>`;

    document.getElementById("userTableBody").innerHTML += row;
            }
        )
    }

    async function addUser(event){
        if(event)  event.preventDefault();
        const employeeId = document.getElementById("employeeId").value;
        const fullName = document.getElementById("fullName").value;
        const email = document.getElementById("email").value;
        const company = document.getElementById("company").value;
        const department = document.getElementById("department").value;
        const role = document.getElementById("role").value;
        const response =  await fetch("http://localhost:8080/api/user", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({employeeId: employeeId,
            fullName: fullName,
            department: department,
            email: email,
            role: role,
            company: company})
        });
        if(!response.ok){
            document.getElementById("message").textContent ="Could not add user.";
            return;
        }
        else{
            document.getElementById("message").textContent = "";
            loadUsers();
        }
    }
    loadUsers();
    document.getElementById("userForm").addEventListener("submit", addUser);

</script>
</body>

</html>
