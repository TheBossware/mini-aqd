<!DOCTYPE html>
<html>
<head>
    <title>Reports</title>
</head>
<body>
     <h1>Reports</h1>

     <table>
         <thead>
             <tr>
                 <th>Report Number</th>
                 <th>Title</th>
                 <th>Description</th>
                 <th>Occurrence Date</th>
                 <th>Report Time</th>
                 <th>Reporter</th>
             </tr>
         </thead>

         <tbody
              id = "reportsTableBody">
         </tbody>
     </table>

     <form id = "reportForm">
        <input type="text" id="title" placeholder="Title">
         <input type="text" id="description" placeholder="Description">
         <input type="datetime-local" id="occurrenceDate">
         <select id="reporterId">

         </select>
         <button type="submit"> Add Report</button>
     </form>

     <p id="message" style="color: darkred"></p>

<script>
    async function loadReports() {
        const response = await fetch("http://localhost:8080/api/reports");
        const reports = await response.json();
        console.log(reports);
        document.getElementById("reportsTableBody").innerHTML = "";
        reports.forEach(function(report){
           const row =  `<tr>
           <td>${report.reportNumber}</td>
           <td>${report.title}</td>
           <td>${report.description}</td>
           <td>${report.occurrenceDate}</td>
           <td>${report.reportTime}</td>
           <td>${report.reporterName}</td>
           </tr>`;

           document.getElementById("reportsTableBody").innerHTML += row;

        } )
    }
    async function loadReporters() {
        const response = await fetch("http://localhost:8080/api/user");
        const reporters = await response.json();
        console.log(reporters);
        reporters.forEach(function(reporter){
            const option= `<option value="${reporter.id}">${reporter.fullName}</option>`;
                document.getElementById("reporterId").innerHTML += option;
        });
    }

    async function addReports(event) {
        if(event) event.preventDefault();
        const title = document.getElementById("title").value;
        const description = document.getElementById("description").value;
        const occurrenceDate = document.getElementById("occurrenceDate").value;
        const reporterId = document.getElementById("reporterId").value;
        const response = await fetch("http://localhost:8080/api/reports", {
            method: "POST",
            headers: {"Content-Type" : "application/json"},
            body: JSON.stringify({
                title: title,
                description: description,
                occurrenceDate: occurrenceDate,
                reporterId: reporterId
            })
        });
        const messageElement = document.getElementById("message")
        if(!response.ok){
            messageElement.textContent = "Could not add report."
            return;
        }
        messageElement.textContent = ""
        loadReports();

    }

    loadReports();
    loadReporters();
    document.getElementById("reportForm").addEventListener("submit", addReports)


</script>
</body>
</html>
